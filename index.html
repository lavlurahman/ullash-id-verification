
<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#123b5d">
  <title>Teacher ID Verification | Ullash Academic Programme</title>

  <style>
    :root {
      --navy: #123b5d;
      --gold: #e5ad37;
      --ink: #14263a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: linear-gradient(135deg,#edf3f8,#f9f6ed);
      font-family: Arial,"Noto Sans Bengali",sans-serif;
      color: var(--ink);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .wrap {
      width: min(760px,100%);
    }

    .brand {
      background: var(--navy);
      color: #fff;
      padding: 24px 28px;
      border-radius: 22px 22px 0 0;
      border-bottom: 5px solid var(--gold);
    }

    .brand small {
      color: #f3bd4e;
      letter-spacing: 2px;
    }

    .brand h1 {
      margin: 0 0 5px;
      font-size: clamp(22px,4vw,32px);
    }

    .card {
      background: #fff;
      border-radius: 0 0 22px 22px;
      box-shadow: 0 18px 55px #18324a20;
      overflow: hidden;
    }

    .content {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 28px;
      padding: 30px;
    }

    .photo {
      width: 100%;
      aspect-ratio: 4/5;
      object-fit: cover;
      border-radius: 16px;
      border: 4px solid #fff;
      box-shadow: 0 5px 20px #102b451c;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #e8f7ef;
      color: #14733d;
      border: 1px solid #b8e6c9;
      padding: 8px 12px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 14px;
    }

    .dot {
      width: 9px;
      height: 9px;
      background: #20a45a;
      border-radius: 50%;
    }

    h2 {
      font-size: 28px;
      margin: 16px 0 6px;
      color: var(--navy);
    }

    .role {
      color: #64748b;
      margin: 0 0 22px;
    }

    .row {
      padding: 12px 0;
      border-bottom: 1px solid #e8edf2;
    }

    .label {
      font-size: 12px;
      color: #718096;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .value {
      font-size: 17px;
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    .id {
      font-family: ui-monospace,monospace;
      color: var(--navy);
      letter-spacing: .5px;
    }

    .foot {
      padding: 16px 30px;
      background: #f5f8fb;
      color: #64748b;
      font-size: 12px;
      line-height: 1.6;
    }

    .error {
      padding: 40px;
      text-align: center;
    }

    .error h2 {
      color: #9b2635;
    }

    @media(max-width:580px) {
      body {
        padding: 12px;
      }

      .content {
        grid-template-columns: 1fr;
        padding: 22px;
        gap: 18px;
      }

      .photo {
        max-width: 190px;
        display: block;
        margin: auto;
      }

      .brand {
        padding: 20px;
      }

      .value {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <main class="wrap">

    <header class="brand">
      <h1>উল্লাস একাডেমিক প্রোগ্রাম</h1>
      <small>ULLASH ACADEMIC PROGRAMME</small>
    </header>

    <section class="card" id="result" aria-live="polite">

      <div class="error">
        <h2>যাচাই করা হচ্ছে…</h2>
        <p>Please wait while we verify this teacher ID.</p>
      </div>

    </section>

  </main>

  <script>
    const result = document.getElementById("result");

    const id = new URLSearchParams(
      location.search
    ).get("id");

    // Prevent HTML injection from record values
    const safe = value =>
      String(value ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[c]));

    async function verify() {

      if (!id) {

        result.innerHTML = `
          <div class="error">
            <h2>আইডি নম্বর পাওয়া যায়নি</h2>
            <p>Scan the QR code printed on the teacher ID card.</p>
          </div>
        `;

        return;
      }

      try {

        // Correct path: teachers.json is in the root folder
        const res = await fetch(
          "./teachers.json",
          { cache: "no-store" }
        );

        if (!res.ok) {
          throw new Error(
            "Could not load verification records. HTTP " + res.status
          );
        }

        const records = await res.json();

        const teacher = records[id];

        if (!teacher || teacher.status !== "active") {

          result.innerHTML = `
            <div class="error">
              <h2>পরিচয় যাচাই করা যায়নি</h2>
              <p>
                This ID is not found, inactive, or revoked.
                Please contact the institution.
              </p>
            </div>
          `;

          return;
        }

        result.innerHTML = `

          <div class="content">

            <div>
              <img
                class="photo"
                src="${safe(teacher.photo)}"
                alt="Teacher portrait"
                onerror="this.style.display='none'"
              >
            </div>

            <div>

              <span class="tag">
                <span class="dot"></span>
                VERIFIED RECORD · ACTIVE
              </span>

              <h2>${safe(teacher.name)}</h2>

              <p class="role">
                ${safe(teacher.position)}
              </p>

              <div class="row">
                <div class="label">
                  প্রতিষ্ঠান / Organization
                </div>

                <div class="value">
                  ${safe(teacher.organization)}
                </div>
              </div>

              <div class="row">
                <div class="label">
                  Teacher ID
                </div>

                <div class="value id">
                  ${safe(teacher.public_id)}
                </div>
              </div>

              <div class="row">
                <div class="label">
                  Verification status
                </div>

                <div class="value">
                  Active
                </div>
              </div>

            </div>

          </div>

          <div class="foot">

            এই পৃষ্ঠাটি প্রতিষ্ঠানের প্রকাশিত রেকর্ডের
            ভিত্তিতে পরিচয় যাচাই করে। সন্দেহ হলে
            প্রতিষ্ঠানের সঙ্গে সরাসরি যোগাযোগ করুন।

            <br>

            This page verifies the published institutional
            record; it is not a government identity check.

          </div>

        `;

      } catch (error) {

        console.error(error);

        result.innerHTML = `
          <div class="error">
            <h2>সাময়িক সমস্যা</h2>
            <p>
              Verification data could not be loaded.
              Please check the published files and try again.
            </p>
          </div>
        `;

      }
    }

    verify();

  </script>

</body>
</html>
